# Add these lines to your /config/configuration.yaml

# Enable frontend customization
frontend:
  extra_module_url:
    - /local/namo-kiosk.js?v=4

# Optional: Create a separate lovelace dashboard for namo user
lovelace:
  mode: storage
  # You can add dashboards here if needed

# User configuration (if not already set via UI)
# Make sure user "namo" exists with:
# - Username: namo
# - Name: Namo
# - Local Only access
# - Limited to specific dashboard if possible
